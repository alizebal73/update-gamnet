name: One-time UI toolbar completion

on:
  push:
    paths:
      - '.github/workflows/toolbar-fix.yml'

permissions:
  contents: write

jobs:
  patch-toolbar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch standalone UI
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("index.html")
          source = path.read_text(encoding="utf-8")
          marker = "function showPage(title){document.getElementById('title').textContent=title}"
          if marker not in source:
              raise SystemExit("Toolbar anchor not found")

          replacement = r"""
function toolbarClose(){document.getElementById('detail').innerHTML=''}
function toolbarModal(title,body,width){
  document.getElementById('detail').innerHTML='<div class="detail" onclick="if(event.target===this)toolbarClose()"><div class="modal" style="width:'+(width||620)+'px;max-height:88vh;overflow:auto"><button class="close" onclick="toolbarClose()">×</button><div class="eyebrow">GameNet Toolbar</div><h2>'+title+'</h2>'+body+'</div></div>'
}
function toolbarMoney(n){return Number(n||0).toLocaleString('fa-IR')+' تومان'}
function openChargePanel(){
  toolbarModal('شارژ مشتری',
    '<div class="grid2">'+
    '<div><small>مشتری</small><select id="tbCustomer" style="width:100%;height:30px">'+previewCustomers.map(function(c){return '<option value="'+c.id+'">#'+c.id+' • '+c.name+'</option>'}).join('')+'</select></div>'+
    '<div><small>نرخ ساعتی</small><select id="tbRate" style="width:100%;height:30px"><option value="120000">PC • 120,000</option><option value="150000">PlayStation • 150,000</option><option value="100000">Foosball • 100,000</option></select></div>'+
    '<div><small>مبلغ پرداختی واقعی</small><input id="tbPaid" type="number" value="100000" style="width:100%;height:30px" oninput="updateChargePreview()"></div>'+
    '<div><small>درصد رایگان</small><input id="tbPct" type="number" value="10" min="0" max="100" style="width:100%;height:30px" oninput="updateChargePreview()"></div></div>'+
    '<div class="tariffResult" style="margin-top:10px"><div><small>پرداختی</small><b id="tbPaidOut">100,000 تومان</b></div><div><small>رایگان</small><b id="tbFreeOut">10,000 تومان</b></div><div><small>ارزش کل سرویس</small><b id="tbTotalOut">110,000 تومان</b></div><div><small>زمان معادل</small><b id="tbTimeOut">55:00</b></div></div>'+
    '<div class="detail-alert" style="margin-top:10px">مثال صحیح: مبلغ ۱۰۰,۰۰۰ یعنی پرداختی مشتری ۱۰۰,۰۰۰؛ با ۱۰٪، رایگان ۱۰,۰۰۰ و ارزش کل سرویس ۱۱۰,۰۰۰ تومان است.</div>'+
    '<div class="actions"><button onclick="toolbarClose()">انصراف</button><button class="primary" onclick="saveChargePanel()">ثبت شارژ</button></div>',660);
  updateChargePreview()
}
function updateChargePreview(){
  var paid=Number(document.getElementById('tbPaid').value||0),pct=Math.max(0,Math.min(100,Number(document.getElementById('tbPct').value||0))),rate=Number(document.getElementById('tbRate').value||120000),free=Math.round(paid*pct/100),total=paid+free;
  document.getElementById('tbPaidOut').textContent=toolbarMoney(paid);
  document.getElementById('tbFreeOut').textContent=toolbarMoney(free);
  document.getElementById('tbTotalOut').textContent=toolbarMoney(total);
  document.getElementById('tbTimeOut').textContent=formatRateTime(rate,total)
}
function saveChargePanel(){
  var id=document.getElementById('tbCustomer').value,c=previewCustomers.find(function(x){return x.id===id});
  if(!c){showToast('مشتری پیدا نشد');return}
  var paid=Number(document.getElementById('tbPaid').value||0),pct=Number(document.getElementById('tbPct').value||0),free=Math.round(paid*pct/100);
  c.balance=Number(c.balance||0)+paid;c.freeCredit=Number(c.freeCredit||0)+free;
  showToast('شارژ ثبت شد • پرداختی '+toolbarMoney(paid)+' • رایگان '+toolbarMoney(free)+' • ارزش کل '+toolbarMoney(paid+free));toolbarClose()
}
function openNewDevicePanel(){
  toolbarModal('دستگاه جدید',
    '<div class="grid2"><div><small>شناسه</small><input id="tbDeviceId" value="PC16" style="width:100%;height:30px"></div><div><small>نوع</small><select id="tbDeviceType" style="width:100%;height:30px"><option value="pc">PC</option><option value="ps">PlayStation</option><option value="fs">Foosball</option></select></div><div><small>نام نمایشی</small><input id="tbDeviceName" value="سیستم جدید" style="width:100%;height:30px"></div><div><small>وضعیت</small><select id="tbDeviceState" style="width:100%;height:30px"><option>Ready</option><option>Idle</option></select></div></div>'+
    '<div class="detail-alert" style="margin-top:10px">دستگاه به داده‌های همین Preview اضافه می‌شود تا Workflow واقعی UI تست شود.</div><div class="actions"><button onclick="toolbarClose()">انصراف</button><button class="primary" onclick="saveNewDevice()">افزودن</button></div>',560)
}
function saveNewDevice(){
  var id=document.getElementById('tbDeviceId').value.trim().toUpperCase(),type=document.getElementById('tbDeviceType').value,state=document.getElementById('tbDeviceState').value,name=document.getElementById('tbDeviceName').value||'سیستم جدید';
  if(!id){showToast('شناسه الزامی است');return}
  if([].concat(pcs,ps,fs).some(function(x){return x.id===id})){showToast('این شناسه تکراری است');return}
  var rec={id:id,type:type,state:state,customer:'',session:'—',remaining:'—',amount:'—',name:name,remainingSeconds:0};
  if(type==='pc')pcs.push(rec);else if(type==='ps')ps.push(rec);else fs.push(rec);
  document.getElementById('pcCount').textContent=pcs.length;render();showToast('دستگاه '+id+' اضافه شد');toolbarClose()
}
function openToolbarFeature(name){
  var data={
    'بازی‌ها':['مدیریت بازی‌ها','بازی‌های نصب‌شده و فعال بودن آن‌ها را برای Session جدید مدیریت کن.','＋ افزودن بازی','فهرست بازی‌ها','Counter-Strike 2 • فعال<br>Valorant • فعال<br>EA FC 26 • فعال<br>Call of Duty • غیرفعال'],
    'آمار':['آمار و گزارش‌ها','درآمد، Session، شارژ و مصرف منابع در یک نگاه.','خروجی گزارش','شاخص‌های امروز','درآمد: 4,820,000 تومان<br>Session: 19<br>شارژ مشتری: 2,140,000 تومان<br>هدیه/رایگان: 310,000 تومان'],
    'پرداختی':['پرداختی‌ها','فهرست پرداخت‌ها و ثبت پرداخت جدید.','＋ ثبت پرداخت','تراکنش‌های اخیر','12:04 • Ali R. • نقدی • 420,000 • رایگان 42,000<br>11:52 • Sina M. • کارت • 240,000<br>11:40 • Reza K. • اعتبار • 180,000'],
    'تنظیمات':['تنظیمات','تنظیمات پایه رابط و رفتار Preview.','ذخیره تنظیمات','نام گیم‌نت: GameNet 98<br>شعبه: Main<br>هشدار پایان Session: 10 دقیقه<br>Pause خودکار Heartbeat: فعال'],
    'پشتیبان':['پشتیبان‌گیری','ساخت فایل JSON از وضعیت Preview.','ایجاد پشتیبان','محتوا','مشتریان + تنظیمات + داده‌های تستی'],
    'بازیابی':['بازیابی','بازگردانی فایل JSON ساخته‌شده توسط همین Preview.','انتخاب فایل','فایل پشتیبان را انتخاب و بازیابی کن.'],
    'فعال‌سازی':['فعال‌سازی','وضعیت مجوز نرم‌افزار و ورود کد فعال‌سازی.','اعتبارسنجی کد','وضعیت: Trial فعال<br>نسخه: GameNet UI Preview 1.0'],
    'بروزرسانی':['بروزرسانی','بررسی نسخه جدید UI و وضعیت Update.','بررسی بروزرسانی','نسخه نصب: 1.0.0<br>نسخه پیشنهادی: 1.1.0']
  };
  var x=data[name]||[name,'این بخش به عنوان سطح مستقل Toolbar آماده شده است.','بستن','وضعیت','آماده'];
  toolbarModal(x[0],'<div class="detail-alert">'+x[1]+'</div><div class="grid2" style="margin-top:10px"><div><small>'+x[3]+'</small><b style="display:block;margin-top:5px">'+x[4]+'</b></div><div><small>وضعیت</small><b style="display:block;margin-top:5px;color:#14824a">Ready</b></div></div><div class="actions"><button onclick="toolbarClose()">بستن</button><button class="primary" onclick="showToast(\\''+x[2].replace(/'/g,"\\\\'")+'\\')">'+x[2]+'</button></div>',620)
}
function showPage(title){document.getElementById('title').textContent=title}
function toolAction(name){
  if(name==='مشتریان'){openCustomerManager();return}
  if(name==='ادمین‌ها'){openStaffManager();return}
  if(name==='تعرفه'){openTariff();return}
  if(name==='شارژ'){openChargePanel();return}
  if(name==='دستگاه جدید'){openNewDevicePanel();return}
  openToolbarFeature(name)
}
"""
          source = source.replace(marker, replacement, 1)
          first_close = source.find("</html>")
          if first_close != -1:
              source = source[:first_close + len("</html>")] + "\n"
          path.write_text(source, encoding="utf-8")
          PY

      - name: Commit patched UI and remove workflow
        shell: bash
        run: |
          rm -f .github/workflows/toolbar-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/toolbar-fix.yml
          git diff --cached --quiet && exit 0
          git commit -m "feat(ui): complete GameNet toolbar interactions"
          git push
